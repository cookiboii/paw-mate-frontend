<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <!-- ⚡ Dark Mode Early Init (FOUC 방지) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pawmate-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- 🐾 파비콘 (SVG 벡터) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260914" />

    <!-- 🏷️ 기본 메타데이터 -->
    <title>AdoptMate | 새로운 가족을 만나는 곳</title>
    <meta
      name="description"
      content="따뜻한 가족을 기다리는 유기동물 입양 & 실시간 제보 플랫폼 AdoptMate. 새로운 가족을 만나보세요."
    />
    <meta
      name="keywords"
      content="유기동물 입양, 강아지 입양, 고양이 입양, 동물보호, 파우메이트, AdoptMate, 유기견, 유기묘"
    />
    <meta name="author" content="AdoptMate" />

    <!-- 🌐 OpenGraph / SNS 미리보기 카드 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AdoptMate" />
    <meta property="og:title" content="AdoptMate | 새로운 가족을 만나는 곳" />
    <meta
      property="og:description"
      content="새로운 가족을 기다리는 수많은 아이들이 있습니다. 따뜻한 손길로 아이들의 세상을 바꿔주세요."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1200&q=80"
    />
    <meta property="og:locale" content="ko_KR" />

    <!-- ⚡ 폰트 Preconnect & 비차단 병렬 로드 최적화 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 🔤 전역 한글/영문 폰트: Pretendard -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
